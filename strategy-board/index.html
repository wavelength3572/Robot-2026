*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:#111827;border-bottom:1px solid #1e3a5f;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:18px;color:#60a5fa}
header h1 span{color:#f59e0b}
.hdr-r{display:flex;gap:10px;align-items:center}
.btn{background:#1e3a5f;color:#93c5fd;border:1px solid #2563eb;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .15s}
.btn:hover{background:#2563eb;color:#fff}
.bw{border-color:#d97706;color:#fbbf24}.bw:hover{background:#d97706;color:#fff}
.main{display:flex;flex:1;overflow:hidden}
.sb{width:310px;min-width:310px;background:#111827;border-right:1px solid #1e3a5f;display:flex;flex-direction:column;overflow:hidden}
.sb-h{padding:10px 12px 6px;font-size:13px;color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1e3a5f}
.sb-s{flex:1;overflow-y:auto;padding:4px 0}
.sb-s::-webkit-scrollbar{width:6px}
.sb-s::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
.fh{padding:6px 12px;font-size:12px;font-weight:700;color:#6b7280;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.fh:hover{color:#9ca3af}
.fh .ar{transition:transform .15s;font-size:10px}
.fh.col .ar{transform:rotate(-90deg)}
.fc.hid{display:none}
.ai{padding:5px 12px 5px 24px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;transition:background .1s}
.ai:hover{background:#1f2937}
.ai.act{background:#172554}
.cd{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.ai.act .cd{border-color:#fff}
.an{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:3px;flex-shrink:0;flex-wrap:wrap}
.tg{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.t-sp{background:#064e3b;color:#6ee7b7}
.t-sh{background:#7c2d12;color:#fdba74}
.t-as{background:#1e1b4b;color:#a5b4fc}
.t-sm{background:#4a1d96;color:#c4b5fd}
.t-ep{background:#1e3a5f;color:#93c5fd}
.t-st{background:#374151;color:#d1d5db}
.t-ret{background:#1f2937;color:#6b7280}
.t-cl{background:#701a75;color:#f0abfc}
.t-imp{background:#365314;color:#bef264}
.ca{flex:1;position:relative;overflow:hidden}
canvas{display:block}
.leg{position:absolute;top:10px;right:10px;background:rgba(17,24,39,.92);border:1px solid #1e3a5f;border-radius:8px;padding:8px 12px;max-height:300px;overflow-y:auto;min-width:180px;font-size:12px}
.leg:empty{display:none}
.li{display:flex;align-items:center;gap:8px;padding:2px 0}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ctrls{background:#111827;border-top:1px solid #1e3a5f;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.pb{width:36px;height:36px;border-radius:50%;background:#2563eb;border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pb:hover{background:#3b82f6}
.scr{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#374151;outline:none}
.scr::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#60a5fa;cursor:pointer}
.sbs{display:flex;gap:4px}
.spb{background:#1f2937;border:1px solid #374151;color:#9ca3af;padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer}
.spb.act{background:#2563eb;color:#fff;border-color:#2563eb}
.td{font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums;min-width:90px;text-align:center}
.dov{position:fixed;inset:0;background:rgba(37,99,235,.15);border:3px dashed #2563eb;z-index:100;display:none;align-items:center;justify-content:center;pointer-events:none}
.dov.vis{display:flex}
.dov span{background:#1e3a5f;color:#93c5fd;padding:20px 40px;border-radius:12px;font-size:20px;font-weight:600}
.mtt{position:absolute;background:#1f2937;border:1px solid #374151;border-radius:6px;padding:6px 10px;font-size:11px;pointer-events:none;display:none;z-index:50;white-space:nowrap}
/* Match Setup */
.match-panel{padding:8px 10px;border-bottom:1px solid #1e3a5f;font-size:12px}
.match-panel summary{cursor:pointer;color:#60a5fa;font-weight:600;font-size:13px;padding:4px 0}
.match-panel summary:hover{color:#93c5fd}
.mp-row{display:flex;gap:6px;margin:4px 0;align-items:center}
.mp-row label{color:#6b7280;min-width:50px;font-size:11px}
.mp-in{background:#1f2937;border:1px solid #374151;color:#e0e0e0;padding:3px 6px;border-radius:4px;font-size:12px;flex:1;min-width:0}
.mp-in:focus{border-color:#2563eb;outline:none}
.mp-btn{background:#1e3a5f;color:#93c5fd;border:1px solid #2563eb;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.mp-btn:hover{background:#2563eb;color:#fff}
.mp-btn.red{border-color:#dc2626;color:#fca5a5;background:#450a0a}.mp-btn.red:hover{background:#dc2626;color:#fff}
.mp-btn.blue{border-color:#2563eb;color:#93c5fd;background:#172554}.mp-btn.blue:hover{background:#2563eb;color:#fff}
.alliance-row{display:flex;align-items:center;gap:5px;padding:3px 4px;border-radius:4px;margin:2px 0;font-size:12px}
.alliance-row.red-r{background:rgba(220,38,38,0.12);border-left:3px solid #dc2626}
.alliance-row.blue-r{background:rgba(37,99,235,0.12);border-left:3px solid #2563eb}
.alliance-row .tm-num{font-weight:700;min-width:42px}
.alliance-row .tm-name{flex:1;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.alliance-row .tm-epa{color:#fbbf24;font-weight:600;font-size:11px;min-width:36px;text-align:right}
.alliance-row .ds-label{color:#6b7280;font-size:10px;min-width:22px}
.winprob{text-align:center;padding:4px;font-size:11px;margin:4px 0;border-radius:4px;background:#1f2937}
.winprob .wp-bar{height:6px;border-radius:3px;background:#374151;margin:4px 0;overflow:hidden;display:flex}
.winprob .wp-red{background:#dc2626;height:100%}
.winprob .wp-blue{background:#2563eb;height:100%}
/* Draw tool */
.draw-bar{display:flex;gap:6px;align-items:center;padding:0 8px}
.draw-btn{background:#1f2937;border:1px solid #374151;color:#9ca3af;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer}
.draw-btn:hover{border-color:#60a5fa;color:#60a5fa}
.draw-btn.act{background:#172554;border-color:#2563eb;color:#60a5fa}
.draw-color{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.draw-color.sel{border-color:#fff}
</style>
</head>

// ============ COORDINATE TRANSFORMS ============
// Field coords (0,0) is bottom-left of the playable field.
// In the image, that's at (margin, imgH - margin) since image Y is top-down.
function fieldToCanvas(fx, fy) {
  const imgX = (fx + PP_MARGIN) * camScale + camX;
  const imgY = camY + (FIELD_H + PP_MARGIN - fy) * camScale;
  return [imgX, imgY];
}

// ============ BEZIER MATH ============
function cubicBezier(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
  };
}

function lerp2(a, b, t) { return {x: a.x+(b.x-a.x)*t, y: a.y+(b.y-a.y)*t}; }

function getSegmentPoints(waypoints, segIdx) {
  const w0 = waypoints[segIdx], w1 = waypoints[segIdx + 1];
  const p0 = {x: w0.x, y: w0.y};
  const p3 = {x: w1.x, y: w1.y};
  const p1 = w0.nc ? {x: w0.nc.x, y: w0.nc.y} : lerp2(p0, p3, 1/3);
  const p2 = w1.pc ? {x: w1.pc.x, y: w1.pc.y} : lerp2(p0, p3, 2/3);
  return {p0, p1, p2, p3};
}

function pointAtWaypointPos(waypoints, pos) {
  const numSegs = waypoints.length - 1;
  if (numSegs <= 0) return waypoints[0] ? {x:waypoints[0].x,y:waypoints[0].y} : {x:0,y:0};
  let seg = Math.floor(pos);
  let t = pos - seg;
  if (seg >= numSegs) { seg = numSegs - 1; t = 1; }
  if (seg < 0) { seg = 0; t = 0; }
  const {p0,p1,p2,p3} = getSegmentPoints(waypoints, seg);
  return cubicBezier(p0, p1, p2, p3, t);
}

// Sample a full path into points with cumulative arc length
function samplePath(pathData) {
  const wp = pathData.w;
  const numSegs = wp.length - 1;
  if (numSegs <= 0) return [{pt:{x:wp[0].x,y:wp[0].y},pos:0,dist:0}];
  const samples = [];
  let totalDist = 0;
  const stepsPerSeg = 40;
  for (let s = 0; s < numSegs; s++) {
    const {p0,p1,p2,p3} = getSegmentPoints(wp, s);
    for (let i = 0; i <= stepsPerSeg; i++) {
      if (s > 0 && i === 0) continue;
      const t = i / stepsPerSeg;
      const pt = cubicBezier(p0, p1, p2, p3, t);
      if (samples.length > 0) {
        const prev = samples[samples.length-1].pt;
        totalDist += Math.hypot(pt.x-prev.x, pt.y-prev.y);
      }
      samples.push({pt, pos: s + t, dist: totalDist});
    }
  }
  return samples;
}

function getVelocityAtPos(pathData, pos) {
  let vel = pathData.mv || 2.0;
  for (const cz of (pathData.cz || [])) {
    if (pos >= cz.min && pos <= cz.max) {
      vel = Math.min(vel, cz.maxVel);
    }
  }
  return Math.max(vel, 0.05);
}

// Build time-parameterized animation data for a path
function buildAnimData(pathName) {
  const pd = allPaths[pathName] || importedPaths[pathName];
  if (!pd || !pd.w || pd.w.length < 2) return null;
  const samples = samplePath(pd);
  if (samples.length < 2) return null;
  // Compute time for each sample
  let t = 0;
  const timed = [{...samples[0], time: 0}];
  for (let i = 1; i < samples.length; i++) {
    const ds = samples[i].dist - samples[i-1].dist;
    const vel = getVelocityAtPos(pd, samples[i].pos);
    t += ds / vel;
    timed.push({...samples[i], time: t});
  }
  return timed;
}

function posAtTime(animData, t) {
  if (!animData || animData.length === 0) return {x:0,y:0,pos:0};
  if (t <= 0) return {x:animData[0].pt.x,y:animData[0].pt.y,pos:animData[0].pos};
  const last = animData[animData.length-1];
  if (t >= last.time) return {x:last.pt.x,y:last.pt.y,pos:last.pos};
  // Binary search
  let lo = 0, hi = animData.length-1;
  while (lo < hi-1) {
    const mid = (lo+hi)>>1;
    if (animData[mid].time <= t) lo = mid; else hi = mid;
  }
  const a = animData[lo], b = animData[hi];
  const f = (t - a.time) / (b.time - a.time);
  return {x:a.pt.x+(b.pt.x-a.pt.x)*f, y:a.pt.y+(b.pt.y-a.pt.y)*f, pos:a.pos+(b.pos-a.pos)*f};
}

// Get rotation at a position from rotation targets
function getRotationAtPos(pathData, pos) {
  const rts = pathData.rt || [];
  if (rts.length === 0) return pathData.start ? pathData.start.r : 0;
  // Find surrounding rotation targets
  let before = null, after = null;
  for (const rt of rts) {
    if (rt.pos <= pos) before = rt;
    if (rt.pos >= pos && !after) after = rt;
  }
  if (!before && !after) return pathData.start ? pathData.start.r : 0;
  if (!before) return after.rot;
  if (!after) return before.rot;
  if (before.pos === after.pos) return before.rot;
  const f = (pos - before.pos) / (after.pos - before.pos);
  // Interpolate angle (shortest path)
  let diff = after.rot - before.rot;
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;
  return before.rot + diff * f;
}

// ============ DRAWING ============
function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.save();

  // Draw PathPlanner field image (dimmed so paths pop)
  if (fieldImgLoaded && fieldImg) {
    const totalW = (FIELD_W + 2 * PP_MARGIN) * camScale;
    const totalH = (FIELD_H + 2 * PP_MARGIN) * camScale;
    ctx.globalAlpha = 0.7;
    ctx.drawImage(fieldImg, camX, camY, totalW, totalH);
    ctx.globalAlpha = 1;
  } else {
    const [fx0,fy0] = fieldToCanvas(0, 0);
    const [fx1,fy1] = fieldToCanvas(FIELD_W, FIELD_H);
    ctx.fillStyle = '#1a2332';
    ctx.fillRect(Math.min(fx0,fx1), Math.min(fy0,fy1), Math.abs(fx1-fx0), Math.abs(fy1-fy0));
    ctx.fillStyle = '#4b5563';
    ctx.font = `${14*devicePixelRatio}px sans-serif`;
    ctx.textAlign = 'center';
    const [cxf,cyf] = fieldToCanvas(FIELD_W/2, FIELD_H/2);
    ctx.fillText('Loading field image...', cxf, cyf);
  }

  // Draw each active auto (ghost-style: first = full opacity, rest = 81% like Team 103)
  const activeList = [...activeAutos];
  for (let ai = 0; ai < activeList.length; ai++) {
    const autoName = activeList[ai];
    const auto = allAutos[autoName] || importedAutos[autoName];
    if (!auto) continue;
    const color = colorMap[autoName] || '#888';
    const ghostAlpha = ai === 0 ? 0.9 : 0.65; // first auto brighter, ghosts dimmer

    for (let pi = 0; pi < auto.paths.length; pi++) {
      const pathName = auto.paths[pi];
      const pd = allPaths[pathName] || importedPaths[pathName];
      if (!pd || !pd.w || pd.w.length < 2) continue;
      const wp = pd.w;

      // Draw constraint zones as thick colored underlay
      for (const cz of (pd.cz || [])) {
        const zColor = ZONE_COLORS[cz.name] || 'rgba(156,163,175,0.15)';
        drawPathSegmentRange(wp, cz.min, cz.max, zColor, 14 * devicePixelRatio);
      }

      // Draw path
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3 * devicePixelRatio;
      ctx.setLineDash(auto.folder === 'Retired' ? [8,6] : []);
      ctx.globalAlpha = auto.folder === 'Retired' ? 0.3 : ghostAlpha;
      const [sx, sy] = fieldToCanvas(wp[0].x, wp[0].y);
      ctx.moveTo(sx, sy);
      for (let s = 0; s < wp.length - 1; s++) {
        const {p0,p1,p2,p3} = getSegmentPoints(wp, s);
        const [c1x,c1y] = fieldToCanvas(p1.x, p1.y);
        const [c2x,c2y] = fieldToCanvas(p2.x, p2.y);
        const [ex,ey] = fieldToCanvas(p3.x, p3.y);
        ctx.bezierCurveTo(c1x, c1y, c2x, c2y, ex, ey);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;

      // Start marker - robot bumper outline at starting pose
      const startRot = pd.start ? pd.start.r : 0;
      const impCfg = importedAutos[autoName] ? importedRobotConfigs['imported'] : null;
      drawRobotBumper(wp[0].x, wp[0].y, startRot, color, ghostAlpha * 0.5, impCfg);

      // End marker - robot bumper outline at ending pose (dimmer)
      const endRot = pd.end ? pd.end.r : 0;
      drawRobotBumper(wp[wp.length-1].x, wp[wp.length-1].y, endRot, color, ghostAlpha * 0.3, impCfg);

      // Event markers
      for (const em of (pd.em || [])) {
        if (!em.name && !em.cmd) continue;
        const pt = pointAtWaypointPos(wp, em.pos);
        const [mx,my] = fieldToCanvas(pt.x, pt.y);
        const icon = MARKER_ICONS[em.cmd || em.name] || '\u2b24';
        // Marker background
        ctx.beginPath();
        ctx.arc(mx, my, 10*devicePixelRatio, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2*devicePixelRatio;
        ctx.stroke();
        // Icon
        ctx.fillStyle = '#fff';
        ctx.font = `${11*devicePixelRatio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(icon, mx, my + 4*devicePixelRatio);
        // Label
        ctx.fillStyle = color;
        ctx.font = `bold ${9*devicePixelRatio}px sans-serif`;
        ctx.fillText(em.cmd || em.name, mx, my - 14*devicePixelRatio);
      }

      // Rotation arrows along path
      for (const rt of (pd.rt || [])) {
        const pt = pointAtWaypointPos(wp, rt.pos);
        const [rx,ry] = fieldToCanvas(pt.x, pt.y);
        const rad = (-rt.rot + 90) * Math.PI / 180;
        const arLen = 8 * devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx + Math.cos(rad)*arLen, ry - Math.sin(rad)*arLen);
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 1.5 * devicePixelRatio;
        ctx.stroke();
        ctx.globalAlpha = 1;

        const midPos = (ptz.min + ptz.max) / 2;
        const pt = pointAtWaypointPos(wp, midPos);
        const [px,py] = fieldToCanvas(pt.x, pt.y);
        const [tx,ty] = fieldToCanvas(ptz.tx, ptz.ty);
        ctx.beginPath();
        ctx.setLineDash([4,4]);
        ctx.moveTo(px, py);
        ctx.lineTo(tx, ty);
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 1.5 * devicePixelRatio;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        // Target dot
        ctx.beginPath();
        ctx.arc(tx, ty, 4*devicePixelRatio, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.5;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // Animation dots
  if (playing || animTime > 0) {
    drawAnimationDots();
  }

  // Draw in-progress freehand path
  drawInProgressPath();

  ctx.restore();
}

function drawPathSegmentRange(wp, minPos, maxPos, color, width) {
  const steps = 30;
  const clampMin = Math.max(0, minPos);
  const clampMax = Math.min(wp.length - 1, maxPos);
  if (clampMax <= clampMin) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash([]);
  for (let i = 0; i <= steps; i++) {
    const pos = clampMin + (clampMax - clampMin) * (i / steps);
    const pt = pointAtWaypointPos(wp, pos);
    const [cx,cy] = fieldToCanvas(pt.x, pt.y);
    if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
  }
  ctx.stroke();
}


// Draw robot exactly like PathPlanner: bumper outline, front dot, swerve modules, features
// robotCfg: optional override config; teamLabel: optional team number string
function drawRobotBumper(fx, fy, rotDeg, color, alpha, robotCfg, teamLabel) {
  const bot = robotCfg || ROBOT;
  const [canvX, canvY] = fieldToCanvas(fx, fy);
  const rad = (-rotDeg + 90) * Math.PI / 180;
  const halfW = bot.w / 2 * camScale;
  const halfL = bot.h / 2 * camScale;
  const bumperR = Math.min(halfW, halfL) * 0.15; // bumper corner radius

  ctx.save();
  ctx.translate(canvX, canvY);
  ctx.rotate(-rad + Math.PI / 2);
  ctx.globalAlpha = alpha;

  // 1. Robot features first (drawn under bumper outline)
  for (const f of (bot.features || [])) {
    const sw = Math.max(1, f.strokeWidth * camScale);
    ctx.lineWidth = sw;
    // PathPlanner coords: +x = forward (front of robot), +y = left
    // In our rotated canvas: -y = forward (up), x = left-right
    // So: canvas_x = -feature.y * scale (left-right), canvas_y = -feature.x * scale (front-back)
    const fcx = -f.cy * camScale;
    const fcy = -f.cx * camScale;

    if (f.type === 'circle') {
      const r = f.radius * camScale;
      ctx.beginPath();
      ctx.arc(fcx, fcy, r, 0, Math.PI * 2);
      if (f.filled) {
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha * 0.3;
        ctx.fill();
        ctx.globalAlpha = alpha;
      }
      ctx.strokeStyle = color;
      ctx.stroke();
    } else if (f.type === 'rounded_rect') {
      // PP width = left-right → canvas x-axis
      // PP length = front-back → canvas y-axis
      const rw = f.width * camScale;   // left-right extent (canvas x)
      const rl = f.length * camScale;  // front-back extent (canvas y)
      const br = f.borderRadius * camScale;
      ctx.beginPath();
      ctx.roundRect(fcx - rw / 2, fcy - rl / 2, rw, rl, br);
      if (f.filled) {
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha * 0.3;
        ctx.fill();
        ctx.globalAlpha = alpha;
      }
      ctx.strokeStyle = color;
      ctx.stroke();
    }
  }

  // 2. Swerve modules as small filled rounded rects
  const modW = 0.04 * camScale;  // module width ~4cm
  const modL = 0.06 * camScale;  // module length ~6cm
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  for (const m of (bot.modules || [])) {
    const mx = -m.y * camScale;
    const my = -m.x * camScale;
    ctx.beginPath();
    ctx.roundRect(mx - modW / 2, my - modL / 2, modW, modL, 1);
    ctx.fill();
  }

  // 3. Bumper outline (on top of features)
  ctx.strokeStyle = color;
  ctx.lineWidth = 2 * devicePixelRatio;
  ctx.beginPath();
  ctx.roundRect(-halfW, -halfL, halfW * 2, halfL * 2, bumperR);
  ctx.stroke();

  // 4. Front indicator dot (PathPlanner style - at front center of bumper)
  const dotR = Math.max(3, halfW * 0.12);
  ctx.beginPath();
  ctx.arc(0, -halfL + dotR + 1 * devicePixelRatio, dotR, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1 * devicePixelRatio;
  ctx.stroke();

  // 5. Team number label (centered on robot)
  if (teamLabel) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 3 * devicePixelRatio;
    ctx.font = `bold ${Math.max(10, halfW * 0.55)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.strokeText(teamLabel, 0, halfL * 0.25);
    ctx.fillText(teamLabel, 0, halfL * 0.25);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawAnimationDots() {
  // Collect all robot positions at current time for collision detection
  const robotPositions = [];
  for (const autoName of activeAutos) {
    const auto = allAutos[autoName] || importedAutos[autoName];
    if (!auto) continue;
    const color = colorMap[autoName] || '#888';
    let elapsed = 0;
    for (const pathName of auto.paths) {
      if (!pathSamples[pathName]) pathSamples[pathName] = buildAnimData(pathName);
      const ad = pathSamples[pathName];
      if (!ad || ad.length === 0) continue;
      const pathDur = ad[ad.length-1].time;
      const localT = animTime - elapsed;
      if (localT >= 0 && localT <= pathDur) {
        const pd = allPaths[pathName] || importedPaths[pathName];
        const p = posAtTime(ad, localT);
        const rot = pd ? getRotationAtPos(pd, p.pos) : 0;
        const rCfg = importedAutos[autoName] ? importedRobotConfigs['imported'] : null;
        const tLabel = getTeamLabel(autoName);
        const allianceClr = getAllianceColor(autoName);
        robotPositions.push({x:p.x, y:p.y, rot, color: allianceClr || color, autoName, pathName, pd, pos:p.pos, robotCfg:rCfg, teamLabel:tLabel});
      }
      elapsed += pathDur;
    }
  }
  // Draw robots with proper bumper outlines
  for (const rp of robotPositions) {
    drawRobotBumper(rp.x, rp.y, rp.rot, rp.color, 0.85, rp.robotCfg, rp.teamLabel);
    // Flash event markers when robot is near
    if (rp.pd) {
      for (const em of (rp.pd.em || [])) {
        if (!em.name && !em.cmd) continue;
        if (Math.abs(rp.pos - em.pos) < 0.15) {
          const ept = pointAtWaypointPos(rp.pd.w, em.pos);
          const [mx,my] = fieldToCanvas(ept.x, ept.y);
          ctx.beginPath();
          ctx.arc(mx, my, 18*devicePixelRatio, 0, Math.PI*2);
          ctx.fillStyle = rp.color;
          ctx.globalAlpha = 0.3 + 0.3 * Math.sin(Date.now() / 100);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
  }
  // Simple bounding circle collision detection
  const collisionR = Math.max(ROBOT.w, ROBOT.h) * 0.6;
  for (let i = 0; i < robotPositions.length; i++) {
    for (let j = i + 1; j < robotPositions.length; j++) {
      const a = robotPositions[i], b = robotPositions[j];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist < collisionR) {
        const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
        const [cx,cy] = fieldToCanvas(midX, midY);
        const warnR = collisionR * 0.5 * camScale;
        const pulse = 0.6 + 0.3 * Math.sin(Date.now() / 150);
        ctx.globalAlpha = pulse;
        ctx.beginPath();
        ctx.arc(cx, cy, warnR, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,23,68,0.25)';
        ctx.fill();
        ctx.strokeStyle = '#FF1744';
        ctx.lineWidth = 3 * devicePixelRatio;
        ctx.stroke();
        ctx.beginPath();
        const xr = warnR * 0.45;
        ctx.moveTo(cx-xr, cy-xr); ctx.lineTo(cx+xr, cy+xr);
        ctx.moveTo(cx+xr, cy-xr); ctx.lineTo(cx-xr, cy+xr);
        ctx.stroke();
        ctx.fillStyle = '#FF1744';
        ctx.font = `bold ${10*devicePixelRatio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('COLLISION', cx, cy + warnR + 14*devicePixelRatio);
        ctx.globalAlpha = 1;
      }
    }
  }
}

// ============ UI: CATALOG ============
const FOLDER_LABELS = {
  'CompSprintAutoShoot': {label:'Sprint + Auto Shoot', tags:[['Sprint','t-sp'],['Auto Shoot','t-as']]},
  'CompSprintStationaryShoot': {label:'Sprint + Stationary Shoot', tags:[['Sprint','t-sp'],['Stationary','t-st']]},
  'CompSprintSotMNoPass': {label:'Sprint + SotM No Pass', tags:[['Sprint','t-sp'],['SotM','t-sm']]},
  'CompSprintEndofPath': {label:'Sprint + End of Path', tags:[['Sprint','t-sp'],['EoP','t-ep']]},
  'CompShootPreloadsAutoShoot': {label:'Shoot Preloads + Auto Shoot', tags:[['Preloads','t-sh'],['Auto Shoot','t-as']]},
  'CompShootPreloadsEndofPath': {label:'Shoot Preloads + End of Path', tags:[['Preloads','t-sh'],['EoP','t-ep']]},
  'CompShootPreloadsSotMNoPass': {label:'Shoot Preloads + SotM No Pass', tags:[['Preloads','t-sh'],['SotM','t-sm']]},
  'Retired': {label:'Retired', tags:[['Retired','t-ret']]},
  'Imported': {label:'Imported', tags:[['Imported','t-imp']]}
};

function buildCatalog() {
  const cat = document.getElementById('catalog');
  cat.innerHTML = '';
  // Group by folder
  const groups = {};
  for (const [name, auto] of Object.entries(allAutos)) {
    const f = auto.folder || 'Other';
    if (!groups[f]) groups[f] = [];
    groups[f].push(name);
  }
  for (const [name, auto] of Object.entries(importedAutos)) {
    if (!groups['Imported']) groups['Imported'] = [];
    groups['Imported'].push(name);
  }
  // Sort folders: comp first, retired last, imported after retired
  const order = ['CompSprintAutoShoot','CompSprintStationaryShoot','CompSprintSotMNoPass','CompSprintEndofPath',
    'CompShootPreloadsAutoShoot','CompShootPreloadsEndofPath','CompShootPreloadsSotMNoPass','Retired','Imported'];
  const sortedFolders = [...new Set([...order, ...Object.keys(groups)])].filter(f => groups[f]);

  for (const folder of sortedFolders) {
    const autos = groups[folder].sort();
    const fl = FOLDER_LABELS[folder] || {label: folder, tags: []};
    const sec = document.createElement('div');
    sec.className = 'folder-section';
    const hdr = document.createElement('div');
    hdr.className = 'fh';
    hdr.innerHTML = `<span class="ar">&#9660;</span> ${fl.label} (${autos.length})`;
    hdr.onclick = () => {
      hdr.classList.toggle('col');
      content.classList.toggle('hid');
    };
    // Collapse retired by default
    if (folder === 'Retired') hdr.classList.add('col');
    sec.appendChild(hdr);
    const content = document.createElement('div');
    content.className = 'fc' + (folder === 'Retired' ? ' hid' : '');
    for (const name of autos) {
      const auto = allAutos[name] || importedAutos[name];
      const item = document.createElement('div');
      item.className = 'ai' + (activeAutos.has(name) ? ' act' : '');
      item.dataset.name = name;
      const clr = colorMap[name] || '#444';
      const tagsHtml = (fl.tags || []).map(([t,c]) => `<span class="tg ${c}">${t}</span>`).join('');
      const climbTag = (auto.cmds || []).includes('ClimberClimb') ? '<span class="tg t-cl">Climb</span>' : '';
      item.innerHTML = `<div class="cd" style="background:${clr}"></div><span class="an" title="${name}">${name}</span><div class="tags">${tagsHtml}${climbTag}</div>`;
      item.onclick = () => toggleAuto(name);
      content.appendChild(item);
    }
    sec.appendChild(content);
    cat.appendChild(sec);
  }
}

function assignColor(name, imported) {
  if (colorMap[name]) return;
  if (imported) {
    colorMap[name] = IMPORT_COLORS[impColorIdx % IMPORT_COLORS.length];
    impColorIdx++;
  } else {
    colorMap[name] = COLORS[colorIdx % COLORS.length];
    colorIdx++;
  }
}

// Pre-assign colors to all team autos
for (const name of Object.keys(allAutos)) {
  assignColor(name, false);
}

function toggleAuto(name) {
  if (activeAutos.has(name)) {
    activeAutos.delete(name);
  } else {
    activeAutos.add(name);
    assignColor(name, !!importedAutos[name]);
  }
  // Reset animation caches
  pathSamples = {};
  updateTotalTime();
  updateUI();
  draw();
}

function updateUI() {
  // Update catalog active states
  document.querySelectorAll('.ai').forEach(el => {
    el.classList.toggle('act', activeAutos.has(el.dataset.name));
  });
  // Update legend
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  for (const name of activeAutos) {
    const c = colorMap[name] || '#888';
    const auto = allAutos[name] || importedAutos[name];
    const pathNames = auto ? auto.paths.join(', ') : '';
    leg.innerHTML += `<div class="li"><div class="ld" style="background:${c}"></div><span>${name}</span></div>`;
  }
}

function updateTotalTime() {
  totalTime = 0;
  for (const autoName of activeAutos) {
    const auto = allAutos[autoName] || importedAutos[autoName];
    if (!auto) continue;
    let autoTime = 0;
    for (const pathName of auto.paths) {
      if (!pathSamples[pathName]) pathSamples[pathName] = buildAnimData(pathName);
      const ad = pathSamples[pathName];
      if (ad && ad.length > 0) autoTime += ad[ad.length-1].time;
    }
    // Add waits
    for (const w of (auto.waits || [])) autoTime += w;
    totalTime = Math.max(totalTime, autoTime);
  }
  if (totalTime < 1) totalTime = 15;
  document.getElementById('timeDisp').textContent = `0.0s / ${totalTime.toFixed(1)}s`;
}

// ============ ANIMATION LOOP ============
function animate(ts) {
  if (playing) {
    if (lastFrame === 0) lastFrame = ts;
    const dt = (ts - lastFrame) / 1000 * animSpeed;
    animTime += dt;
    if (animTime > totalTime) { animTime = 0; }
    lastFrame = ts;
    document.getElementById('scrubber').value = (animTime / totalTime) * 1000;
    document.getElementById('timeDisp').textContent = `${animTime.toFixed(1)}s / ${totalTime.toFixed(1)}s`;
    draw();
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ============ CONTROLS ============
document.getElementById('playBtn').onclick = () => {
  playing = !playing;
  lastFrame = 0;
  document.getElementById('playBtn').innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
  if (playing && activeAutos.size === 0) {
    // Auto-select first comp auto
    const first = Object.keys(allAutos).find(n => allAutos[n].folder !== 'Retired');
    if (first) toggleAuto(first);
  }
};

document.getElementById('scrubber').oninput = (e) => {
  animTime = (e.target.value / 1000) * totalTime;
  document.getElementById('timeDisp').textContent = `${animTime.toFixed(1)}s / ${totalTime.toFixed(1)}s`;
  draw();
};

document.querySelectorAll('.spb').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.spb').forEach(b => b.classList.remove('act'));
    btn.classList.add('act');

});

// ============ VIEW ============
function fitToScreen() {
  const totalW = FIELD_W + 2 * PP_MARGIN;
  const totalH = FIELD_H + 2 * PP_MARGIN;
  const scaleX = canvas.width / totalW;
  const scaleY = canvas.height / totalH;
  camScale = Math.min(scaleX, scaleY);
  camX = (canvas.width - totalW * camScale) / 2;
  camY = (canvas.height - totalH * camScale) / 2;
}

// ============ HOVER TOOLTIPS ============
canvas.addEventListener('mousemove', (e) => {
  if (drawActive) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * devicePixelRatio;
  const my = (e.clientY - rect.top) * devicePixelRatio;
  const tt = document.getElementById('mtt');
  let found = false;
  for (const autoName of activeAutos) {
    const auto = allAutos[autoName] || importedAutos[autoName];
    if (!auto) continue;
    for (const pathName of auto.paths) {
      const pd = allPaths[pathName] || importedPaths[pathName];
      if (!pd) continue;
      for (const em of (pd.em || [])) {
        if (!em.name && !em.cmd) continue;
        const pt = pointAtWaypointPos(pd.w, em.pos);
        const [cx,cy] = fieldToCanvas(pt.x, pt.y);
        if (Math.hypot(mx-cx, my-cy) < 15*devicePixelRatio) {
          tt.style.display = 'block';
          tt.style.left = (e.clientX + 12) + 'px';
          tt.style.top = (e.clientY - 10) + 'px';
          tt.textContent = `${em.cmd||em.name} (${pathName} @ pos ${em.pos.toFixed(2)})`;
          found = true;
          break;
        }
      }
      if (found) break;
    }
    if (found) break;
  }
  if (!found) tt.style.display = 'none';
});

// Imported team robot configs (keyed by team label or 'imported')
let importedRobotConfigs = {};

function parseSettingsJson(data) {
  const cfg = {
    w: data.robotWidth || 0.9, h: data.robotLength || 0.8,
    modules: [
      {x: data.flModuleX||0, y: data.flModuleY||0},
      {x: data.frModuleX||0, y: data.frModuleY||0},
      {x: data.blModuleX||0, y: data.blModuleY||0},
      {x: data.brModuleX||0, y: data.brModuleY||0}
    ],
    features: (data.robotFeatures || []).map(raw => {
      const f = typeof raw === 'string' ? JSON.parse(raw) : raw;
      const d = f.data || {};
      if (f.type === 'circle') {
        return {name:f.name||'',type:'circle',cx:d.center?.x||0,cy:d.center?.y||0,
          radius:d.radius||0,strokeWidth:d.strokeWidth||0.01,filled:!!d.filled};
      } else {
        return {name:f.name||'',type:'rounded_rect',cx:d.center?.x||0,cy:d.center?.y||0,
          width:d.size?.width||0,length:d.size?.length||0,
          borderRadius:d.borderRadius||0,strokeWidth:d.strokeWidth||0.02,filled:!!d.filled};
      }
    }),
    maxVel: data.defaultMaxVel || 2.5,
    maxAccel: data.defaultMaxAccel || 2.5
  };
  return cfg;
}

function handleFiles(files) {
  const autoFiles = [];
  const pathFiles = [];
  const settingsFiles = [];
  for (const f of files) {
    if (f.name.endsWith('.auto')) autoFiles.push(f);
    else if (f.name.endsWith('.path')) pathFiles.push(f);
    else if (f.name === 'settings.json' || (f.name.endsWith('.json') && !f.name.endsWith('.auto') && !f.name.endsWith('.path'))) settingsFiles.push(f);
  }
  const total = autoFiles.length + pathFiles.length + settingsFiles.length;
  if (total === 0) return;

  // Load paths first, then autos
  const loadFile = (f) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const name = f.name.replace(/\.(auto|path)$/, '');
        if (f.name.endsWith('.path')) {
          // Convert to our compact format
          const wp = (data.waypoints || []).map(w => {
            const e = {x: w.anchor.x, y: w.anchor.y};
            if (w.nextControl) e.nc = {x: w.nextControl.x, y: w.nextControl.y};
            if (w.prevControl) e.pc = {x: w.prevControl.x, y: w.prevControl.y};
            return e;
          });
          const gc = data.globalConstraints || {};
          const em = (data.eventMarkers || []).map(m => ({
            name: m.name || '',
            pos: m.waypointRelativePos || 0,
            cmd: m.command && m.command.data ? m.command.data.name || '' : ''
          }));
          const cz = (data.constraintZones || []).map(z => ({
            name: z.name || '', min: z.minWaypointRelativePos||0, max: z.maxWaypointRelativePos||0,
            maxVel: z.constraints ? z.constraints.maxVelocity : 2
          }));
          const ptz = (data.pointTowardsZones || []).map(p => ({
            name: p.name||'', tx: p.fieldPosition?p.fieldPosition.x:0, ty: p.fieldPosition?p.fieldPosition.y:0,
            min: p.minWaypointRelativePos||0, max: p.maxWaypointRelativePos||0
          }));
          const rt = (data.rotationTargets || []).map(r => ({pos: r.waypointRelativePos||0, rot: r.rotationDegrees||0}));
          const gs = data.goalEndState || {};
          const is = data.idealStartingState || {};
          importedPaths[name] = {w:wp, mv:gc.maxVelocity||2, ma:gc.maxAcceleration||3, em, cz, ptz, rt,
            end:{v:gs.velocity||0,r:gs.rotation||0}, start:{v:is.velocity||0,r:is.rotation||0}};
          // Also add to allPaths so auto resolution works
          allPaths[name] = importedPaths[name];
        } else {
          // Auto file
          const paths = [];
          const cmds = [];
          const waits = [];
          const walk = (cmd) => {
            const t = cmd.type || '';
            const d = cmd.data || {};
            if (t === 'path') paths.push(d.pathName || '');
            else if (t === 'named') cmds.push(d.name || '');
            else if (t === 'wait') waits.push(d.waitTime || 0);
            for (const sub of (d.commands || [])) walk(sub);
          };
          walk(data.command || {});
          importedAutos[name] = {folder: 'Imported', paths, cmds, waits};
          assignColor(name, true);
        }
      } catch(e) { console.warn('Failed to parse', f.name, e); }
      resolve();
    };
    reader.readAsText(f);
  });

  // Load settings.json files
  const loadSettings = (f) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.robotWidth && data.robotLength) {
          importedRobotConfigs['imported'] = parseSettingsJson(data);
          console.log('Loaded robot config:', importedRobotConfigs['imported']);
        }
      } catch(e) { console.warn('Failed to parse settings', f.name, e); }
      resolve();
    };
    reader.readAsText(f);
  });

  // Load settings first, then paths, then autos
  Promise.all(settingsFiles.map(loadSettings)).then(() =>
  Promise.all([...pathFiles, ...autoFiles].map(loadFile))).then(() => {
    pathSamples = {};
    buildCatalog();
    // Auto-activate imported autos
    for (const name of Object.keys(importedAutos)) {
      if (!activeAutos.has(name)) {
        activeAutos.add(name);
      }
    }
    updateTotalTime();
    updateUI();
    draw();
  });
}

// ============ MATCH SETUP & API INTEGRATION ============
let matchTeams = {}; // {red1:{num,name,epa,winrate}, red2, red3, blue1, blue2, blue3}
let winProbability = null;

// Restore TBA key from localStorage
const savedTbaKey = localStorage.getItem('tba_key');
if (savedTbaKey) document.getElementById('tbaKey').value = savedTbaKey;
document.getElementById('tbaKey').onchange = (e) => localStorage.setItem('tba_key', e.target.value);

// Fetch match from TBA
document.getElementById('fetchMatch').onclick = async () => {
  const key = document.getElementById('tbaKey').value.trim();
  const event = document.getElementById('eventKey').value.trim();
  const num = document.getElementById('matchNum').value.trim();
  if (!key || !event || !num) return alert('Enter TBA key, event key, and match number');
  const matchKey = `${event}_qm${num}`;
  try {
    const r = await fetch(`https://www.thebluealliance.com/api/v3/match/${matchKey}/simple`, {headers:{'X-TBA-Auth-Key':key}});
    if (!r.ok) throw new Error(`TBA error: ${r.status}`);
    const m = await r.json();
    const red = (m.alliances?.red?.team_keys || []).map(k => k.replace('frc',''));
    const blue = (m.alliances?.blue?.team_keys || []).map(k => k.replace('frc',''));
    for (let i = 0; i < 3; i++) {
      document.getElementById(`red${i+1}`).value = red[i] || '';
      document.getElementById(`blue${i+1}`).value = blue[i] || '';
    }
    await lookupAllTeams();
  } catch(e) { alert('Failed to fetch match: ' + e.message); }
};

// Lookup all 6 teams via Statbotics
document.getElementById('lookupTeams').onclick = lookupAllTeams;

async function lookupAllTeams() {
  const slots = ['red1','red2','red3','blue1','blue2','blue3'];
  matchTeams = {};
  const wp = document.getElementById('winProb');
  let redEpa = 0, blueEpa = 0, redCount = 0, blueCount = 0;
  for (const slot of slots) {
    const num = document.getElementById(slot).value.trim();
    if (!num) continue;
    try {
      const r = await fetch(`https://api.statbotics.io/v3/team/${num}`);
      if (!r.ok) continue;
      const d = await r.json();
      const info = {
        num: parseInt(num),
        name: d.name || '',
        epa: d.norm_epa?.current || 0,
        winrate: d.winrate || 0,
        record: `${d.wins||0}-${d.losses||0}`
      };
      matchTeams[slot] = info;
      const infoEl = document.getElementById(slot + 'info');
      if (infoEl) infoEl.textContent = `${info.name} | EPA: ${info.epa} | ${info.record}`;
      if (slot.startsWith('red')) { redEpa += info.epa; redCount++; }
      else { blueEpa += info.epa; blueCount++; }
    } catch(e) { console.warn('Statbotics lookup failed for', num); }
  }
  // Compute win probability from EPA difference (logistic model)
  if (redCount > 0 && blueCount > 0) {
    const redAvg = redEpa / redCount, blueAvg = blueEpa / blueCount;
    const diff = redAvg - blueAvg;
    const redProb = 1 / (1 + Math.exp(-diff / 50)); // logistic scale
    winProbability = {red: redProb, blue: 1 - redProb, redEpa: redAvg, blueEpa: blueAvg};
    wp.style.display = 'block';
    wp.innerHTML = `
      <div style="display:flex;justify-content:space-between">
        <span style="color:#dc2626;font-weight:700">RED ${(redProb*100).toFixed(0)}%</span>
        <span style="color:#6b7280">Win Probability (EPA)</span>
        <span style="color:#2563eb;font-weight:700">${((1-redProb)*100).toFixed(0)}% BLUE</span>
      </div>
      <div class="wp-bar"><div class="wp-red" style="width:${redProb*100}%"></div><div class="wp-blue" style="width:${(1-redProb)*100}%"></div></div>
      <div style="display:flex;justify-content:space-between;color:#6b7280;font-size:10px">
        <span>Avg EPA: ${redAvg.toFixed(0)}</span><span>Avg EPA: ${blueAvg.toFixed(0)}</span>
      </div>`;
  }
  draw();
}

// Get alliance color for an auto (checks if its team is assigned to red/blue)
function getAllianceColor(autoName) {
  // Check if this auto is assigned to a team in the match
  for (const [slot, info] of Object.entries(matchTeams)) {
    if (drawnPathTeams[autoName] === info.num) {
      return slot.startsWith('red') ? '#dc2626' : '#2563eb';
    }
  }
  return null; // not assigned to an alliance
}

// ============ PENCIL DRAWING TOOL ============
// Hold left-click and drag to sketch a path. Release to finish.
let drawMode = false;
let drawActive = false; // true while mouse is held down drawing
let drawRawPoints = []; // raw mouse samples during drag
let drawnPaths = {};
let drawnAutos = {};
let drawnPathTeams = {};
let drawCounter = 0;
let drawColorPick = '#f59e0b';
let drawLabel = '';
let drawTeam = null;

document.getElementById('drawBtn').onclick = () => {
  drawMode = !drawMode;
  document.getElementById('drawBtn').classList.toggle('act', drawMode);
  if (drawMode) {
    canvas.style.cursor = 'crosshair';
    const team = prompt('Team number for this path (or leave blank):');
    drawLabel = prompt('Label (e.g. "4188 Left Side"):') || `Drawn #${drawCounter+1}`;
    drawTeam = team ? parseInt(team) : null;
    drawColorPick = '#f59e0b';
    if (drawTeam) {
      for (const [slot, info] of Object.entries(matchTeams)) {
        if (info.num === drawTeam) {
          drawColorPick = slot.startsWith('red') ? '#dc2626' : '#2563eb';
          break;
        }
      }
    }
  } else {
    canvas.style.cursor = 'default';
    drawRawPoints = [];
  }
};

// Convert mouse event to field coords
function mouseToField(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * devicePixelRatio;
  const my = (e.clientY - rect.top) * devicePixelRatio;
  return {
    x: (mx - camX) / camScale - PP_MARGIN,
    y: FIELD_H + PP_MARGIN - (my - camY) / camScale
  };
}

canvas.addEventListener('mousedown', (e) => {
  if (!drawMode || e.button !== 0) return;
  e.preventDefault();
  drawActive = true;
  drawRawPoints = [mouseToField(e)];
});

canvas.addEventListener('mousemove', (e) => {
  if (!drawActive) return;
  const pt = mouseToField(e);
  // Only add point if moved enough (avoid thousands of points)
  const last = drawRawPoints[drawRawPoints.length - 1];
  if (Math.hypot(pt.x - last.x, pt.y - last.y) > 0.05) {
    drawRawPoints.push(pt);
    draw();
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (!drawActive) return;
  drawActive = false;
  if (drawRawPoints.length < 3) { drawRawPoints = []; draw(); return; }
  // Simplify: downsample raw points to ~15-25 waypoints for smooth Bezier
  const simplified = simplifyPath(drawRawPoints, Math.max(5, Math.min(25, Math.floor(drawRawPoints.length / 3))));
  finishDrawnPath(simplified);
});

// Downsample path to N evenly-spaced points
function simplifyPath(pts, n) {
  if (pts.length <= n) return pts;
  const result = [pts[0]];
  const step = (pts.length - 1) / (n - 1);
  for (let i = 1; i < n - 1; i++) {
    result.push(pts[Math.round(i * step)]);
  }
  result.push(pts[pts.length - 1]);
  return result;
}

function finishDrawnPath(points) {
  drawCounter++;
  const pathName = `drawn_${drawCounter}`;
  // Generate smooth Bezier control points from simplified points
  const wp = points.map((p, i, arr) => {
    const entry = {x: p.x, y: p.y};
    if (i < arr.length - 1) {
      const next = arr[i + 1];
      const dx = (next.x - p.x) * 0.33, dy = (next.y - p.y) * 0.33;
      entry.nc = {x: p.x + dx, y: p.y + dy};
    }
    if (i > 0) {
      const prev = arr[i - 1];
      const dx = (p.x - prev.x) * 0.33, dy = (p.y - prev.y) * 0.33;
      entry.pc = {x: p.x - dx, y: p.y - dy};
    }
    return entry;
  });
  drawnPaths[pathName] = {w:wp, mv:2.0, ma:2.5, em:[], cz:[], ptz:[], rt:[],
    end:{v:0,r:0}, start:{v:0,r:0}};
  allPaths[pathName] = drawnPaths[pathName];
  const autoName = drawLabel || `Drawn #${drawCounter}`;
  drawnAutos[autoName] = {folder:'Drawn', paths:[pathName], cmds:[], waits:[]};
  allAutos[autoName] = drawnAutos[autoName];
  if (drawTeam) drawnPathTeams[autoName] = drawTeam;
  assignColor(autoName, false);
  const ac = getAllianceColor(autoName);
  if (ac) colorMap[autoName] = ac;
  activeAutos.add(autoName);
  // Stay in draw mode so you can sketch more paths
  drawRawPoints = [];
  drawCounter;
  drawLabel = `Drawn #${drawCounter + 1}`;
  pathSamples = {};
  buildCatalog();
  updateTotalTime();
  updateUI();
  draw();
}

// Draw the live pencil stroke
function drawInProgressPath() {
  if (!drawActive || drawRawPoints.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = drawColorPick;
  ctx.lineWidth = 3 * devicePixelRatio;
  ctx.globalAlpha = 0.8;
  const [sx, sy] = fieldToCanvas(drawRawPoints[0].x, drawRawPoints[0].y);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < drawRawPoints.length; i++) {
    const [px, py] = fieldToCanvas(drawRawPoints[i].x, drawRawPoints[i].y);
    ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Start dot
  ctx.beginPath();
  ctx.arc(sx, sy, 5 * devicePixelRatio, 0, Math.PI * 2);
  ctx.fillStyle = drawColorPick;
  ctx.fill();
}

// ============ TEAM NUMBER LABELS ON ROBOTS ============
function getTeamLabel(autoName) {
  // Check drawn paths first
  if (drawnPathTeams[autoName]) return drawnPathTeams[autoName].toString();
  // Check if it's a team auto (our team = 3572)
  if (allAutos[autoName] && !importedAutos[autoName] && !drawnAutos[autoName]) return '3572';
  return '';
}

FOLDER_LABELS['Drawn'] = {label:'Drawn Paths', tags:[['Drawn','t-imp']]};
buildCatalog();
resize();
