<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bread Board - Wavelength 3572</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:#111827;border-bottom:1px solid #1e3a5f;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:18px;color:#f59e0b}
header h1 .tag{color:#6b7280;font-size:13px;font-weight:400;font-style:italic;margin-left:8px}
.hdr-r{display:flex;gap:8px;align-items:center}
.btn{background:#1e3a5f;color:#93c5fd;border:1px solid #2563eb;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:15px;transition:all .15s}
.btn:hover{background:#2563eb;color:#fff}
.btn-r{border-color:#dc2626;color:#fca5a5}.btn-r:hover{background:#dc2626;color:#fff}
.btn-draw{border-color:#f59e0b;color:#fbbf24}.btn-draw:hover{background:#f59e0b;color:#000}
.btn-draw.act{background:#f59e0b;color:#000}
.main{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sb{width:300px;min-width:300px;background:#111827;border-right:1px solid #1e3a5f;display:flex;flex-direction:column;overflow:hidden}
.sb-scroll{flex:1;overflow-y:auto;padding:0}
.sb-scroll::-webkit-scrollbar{width:5px}
.sb-scroll::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
.sec{border-bottom:1px solid #1e3a5f}
.sec-h{padding:8px 10px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;background:#0d1117}
.sec-h.red{color:#dc2626;background:#1a0505}.sec-h.blue{color:#2563eb;background:#05081a}
/* Station slots */
.ds{padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:15px}
.ds-label{color:#6b7280;font-weight:700;min-width:28px;font-size:14px}
.ds-team{background:#1f2937;border:1px solid #374151;color:#e0e0e0;padding:3px 6px;border-radius:4px;font-size:15px;width:58px;text-align:center}
.ds-team:focus{border-color:#2563eb;outline:none}
.ds-auto{background:#1f2937;border:1px solid #374151;color:#e0e0e0;padding:3px 4px;border-radius:4px;font-size:14px;flex:1;min-width:0}
.ds-delay{background:#1f2937;border:1px solid #374151;color:#fbbf24;padding:3px 2px;border-radius:4px;font-size:13px;width:40px;text-align:center}
.ds-delay:focus{border-color:#f59e0b;outline:none}
.ds-info{font-size:12px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:0 10px 4px 44px}
/* TBA row */
.tba-row{padding:6px 10px;display:flex;gap:4px;align-items:center}
.tba-in{background:#1f2937;border:1px solid #374151;color:#e0e0e0;padding:3px 6px;border-radius:4px;font-size:14px;min-width:0}
.tba-in:focus{border-color:#2563eb;outline:none}
/* Win probability */
.wp{padding:4px 10px;font-size:14px}
.wp-bar{height:5px;border-radius:3px;background:#374151;display:flex;overflow:hidden;margin:3px 0}
.wp-r{background:#dc2626;height:100%}.wp-b{background:#2563eb;height:100%}
.wp-labels{display:flex;justify-content:space-between;font-size:13px}
/* Team roster */
.team-item{padding:5px 10px;display:flex;align-items:center;gap:8px;font-size:15px;cursor:default}
.team-item:hover{background:#1f2937}
.team-num{font-weight:700;min-width:40px}.team-ct{color:#6b7280;font-size:14px}
.team-name{color:#9ca3af;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
/* Canvas */
.ca{flex:1;position:relative;overflow:hidden}
canvas{display:block}
.leg{position:absolute;top:8px;right:8px;background:rgba(17,24,39,.9);border:1px solid #1e3a5f;border-radius:6px;padding:6px 10px;font-size:14px;max-height:200px;overflow-y:auto}
.leg:empty{display:none}
.li{display:flex;align-items:center;gap:6px;padding:1px 0}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mtt{position:absolute;background:#1f2937;border:1px solid #374151;border-radius:6px;padding:6px 10px;font-size:14px;pointer-events:none;display:none;z-index:50;white-space:nowrap}
/* Controls */
.ctrls{background:#111827;border-top:1px solid #1e3a5f;padding:6px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.pb{width:32px;height:32px;border-radius:50%;background:#2563eb;border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pb:hover{background:#3b82f6}
.scr{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:#374151;outline:none}
.scr::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#60a5fa;cursor:pointer}
.td{font-size:14px;color:#9ca3af;font-variant-numeric:tabular-nums;min-width:130px;text-align:center}
.sbs{display:flex;gap:3px}
.spb{background:#1f2937;border:1px solid #374151;color:#9ca3af;padding:3px 7px;border-radius:4px;font-size:13px;cursor:pointer}
.spb.act{background:#2563eb;color:#fff;border-color:#2563eb}
/* Drop overlay */
.dov{position:fixed;inset:0;background:rgba(37,99,235,.15);border:3px dashed #2563eb;z-index:100;display:none;align-items:center;justify-content:center;pointer-events:none}
.dov.vis{display:flex}
.dov span{background:#1e3a5f;color:#93c5fd;padding:20px 40px;border-radius:12px;font-size:18px;font-weight:600}
.match-list{max-height:200px;overflow-y:auto;border:1px solid #1e3a5f;border-radius:4px;margin:0 10px 6px}
.match-list::-webkit-scrollbar{width:5px}
.match-list::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
.ml-item{padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #1f2937}
.ml-item:hover{background:#1f2937}
.ml-item.sel{background:#172554;border-left:3px solid #60a5fa}
.ml-item.done{opacity:0.5}
.ml-label{font-weight:600}
.ml-teams{font-size:12px;color:#9ca3af;margin-top:2px}
</style>
</head>

function fitToScreen(){

function fieldToCanvas(fx,fy){
  return[(fx+PP_MARGIN)*camScale+camX, camY+(FIELD_H+PP_MARGIN-fy)*camScale];
}
// Flip a blue-origin point to red-origin (mirror across field center)
function flipPt(x,y){return{x:FIELD_W-x,y:FIELD_H-y};}
// kRotational flip: rotation - 180 (NOT 180 - rotation)
function flipRot(deg){let r=deg-180;while(r>180)r-=360;while(r<-180)r+=360;return r;}
function flipWaypoints(wp){return wp.map(w=>{
  const f={x:FIELD_W-w.x,y:FIELD_H-w.y};
  if(w.nc)f.nc={x:FIELD_W-w.nc.x,y:FIELD_H-w.nc.y};
  if(w.pc)f.pc={x:FIELD_W-w.pc.x,y:FIELD_H-w.pc.y};
  return f;
});}
function canvasToField(cx,cy){
  return[(cx-camX)/camScale-PP_MARGIN, FIELD_H+PP_MARGIN-(cy-camY)/camScale];
}

// ============ BEZIER MATH ============
function cubicBezier(p0,p1,p2,p3,t){
  const u=1-t;
  return{x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x, y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y};
}
function lerp2(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};}
function getSegPts(wp,s){
  const p0={x:wp[s].x,y:wp[s].y}, p3={x:wp[s+1].x,y:wp[s+1].y};
  const p1=wp[s].nc?{x:wp[s].nc.x,y:wp[s].nc.y}:lerp2(p0,p3,1/3);
  const p2=wp[s+1].pc?{x:wp[s+1].pc.x,y:wp[s+1].pc.y}:lerp2(p0,p3,2/3);
  return{p0,p1,p2,p3};
}
function ptAtPos(wp,pos){
  const n=wp.length-1; if(n<=0)return wp[0]?{x:wp[0].x,y:wp[0].y}:{x:0,y:0};
  let s=Math.floor(pos),t=pos-s; if(s>=n){s=n-1;t=1;} if(s<0){s=0;t=0;}
  const{p0,p1,p2,p3}=getSegPts(wp,s); return cubicBezier(p0,p1,p2,p3,t);
}
function samplePath(pd){
  const wp=pd.w,n=wp.length-1; if(n<=0)return[{pt:{x:wp[0].x,y:wp[0].y},pos:0,dist:0}];
  const samples=[]; let td=0; const sps=40;
  for(let s=0;s<n;s++){const{p0,p1,p2,p3}=getSegPts(wp,s);
    for(let i=0;i<=sps;i++){if(s>0&&i===0)continue;const t=i/sps;const pt=cubicBezier(p0,p1,p2,p3,t);
      if(samples.length>0){const prev=samples[samples.length-1].pt;td+=Math.hypot(pt.x-prev.x,pt.y-prev.y);}
      samples.push({pt,pos:s+t,dist:td});}} return samples;
}
function velAtPos(pd,pos){
  let v=pd.mv||2; for(const c of(pd.cz||[]))if(pos>=c.min&&pos<=c.max)v=Math.min(v,c.maxVel); return Math.max(v,0.05);
}
function buildAnimData(pName,teamNum){
  let pd=null; for(const t of Object.values(teams))if(t.paths[pName]){pd=t.paths[pName];break;}
  if(!pd||!pd.w||pd.w.length<2)return null;
  const samples=samplePath(pd); if(samples.length<2)return null;
  let t=0; const timed=[{...samples[0],time:0}];
  for(let i=1;i<samples.length;i++){const ds=samples[i].dist-samples[i-1].dist;t+=ds/velAtPos(pd,samples[i].pos);timed.push({...samples[i],time:t});}
  return timed;
}
function posAtTime(ad,t){
  if(!ad||!ad.length)return{x:0,y:0,pos:0};
  if(t<=0)return{x:ad[0].pt.x,y:ad[0].pt.y,pos:ad[0].pos};
  const last=ad[ad.length-1]; if(t>=last.time)return{x:last.pt.x,y:last.pt.y,pos:last.pos};
  let lo=0,hi=ad.length-1; while(lo<hi-1){const m=(lo+hi)>>1;if(ad[m].time<=t)lo=m;else hi=m;}
  const a=ad[lo],b=ad[hi],f=(t-a.time)/(b.time-a.time);
  return{x:a.pt.x+(b.pt.x-a.pt.x)*f,y:a.pt.y+(b.pt.y-a.pt.y)*f,pos:a.pos+(b.pos-a.pos)*f};
}
function getRotAtPos(pd,pos){
  const rts=pd.rt||[]; if(!rts.length)return pd.start?pd.start.r:0;
  let bef=null,aft=null; for(const r of rts){if(r.pos<=pos)bef=r;if(r.pos>=pos&&!aft)aft=r;}
  if(!bef&&!aft)return pd.start?pd.start.r:0; if(!bef)return aft.rot; if(!aft)return bef.rot;
  if(bef.pos===aft.pos)return bef.rot;
  const f=(pos-bef.pos)/(aft.pos-bef.pos); let d=aft.rot-bef.rot;
  while(d>180)d-=360;while(d<-180)d+=360; return bef.rot+d*f;
}

// ============ ROBOT DRAWING ============
function drawRobotBumper(fx,fy,rotDeg,color,alpha,bot,label){
  bot=bot||DEFAULT_ROBOT;
  const[cx,cy]=fieldToCanvas(fx,fy);
  // PathPlanner: 0=facing +X (right), positive=CCW. Canvas: Y is flipped.
  // Robot front is drawn at -Y in local frame. We need -Y to point in heading direction.
  // Rotate so local -Y (front of robot) points in heading direction on canvas
  // Canvas: +X=right, +Y=down. Heading: 0=right, 90=up (canvas -Y)
  const canvasRad=(90-rotDeg)*Math.PI/180;
  // hw = left-right half (robotWidth), hl = front-back half (robotLength)
  const hw=bot.w/2*camScale, hl=bot.h/2*camScale, cr=Math.min(hw,hl)*0.15;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(canvasRad); ctx.globalAlpha=alpha;
  // Features
  for(const f of(bot.features||[])){
    const sw=Math.max(1,f.strokeWidth*camScale); ctx.lineWidth=sw;
    const fcx=-f.cy*camScale, fcy=-f.cx*camScale;
    if(f.type==='circle'){const r=f.radius*camScale;ctx.beginPath();ctx.arc(fcx,fcy,r,0,Math.PI*2);ctx.strokeStyle=color;ctx.stroke();}
    else if(f.type==='rounded_rect'){const rw=f.width*camScale,rl=f.length*camScale,br=f.borderRadius*camScale;ctx.beginPath();ctx.roundRect(fcx-rw/2,fcy-rl/2,rw,rl,br);ctx.strokeStyle=color;ctx.stroke();}
  }
  // Modules
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(const m of(bot.modules||[])){const mx=-m.y*camScale,my=-m.x*camScale;ctx.fillRect(mx-0.02*camScale,my-0.03*camScale,0.04*camScale,0.06*camScale);}
  // Bumper
  ctx.strokeStyle=color;ctx.lineWidth=2*devicePixelRatio;ctx.beginPath();ctx.roundRect(-hw,-hl,hw*2,hl*2,cr);ctx.stroke();
  // Front dot
  const dr=Math.max(3,hw*0.12);ctx.beginPath();ctx.arc(0,-hl+dr+1,dr,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
  // Team label
  if(label){ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=3*devicePixelRatio;
    ctx.font=`bold ${Math.max(10,hw*0.55)}px sans-serif`;ctx.textAlign='center';
    ctx.strokeText(label,0,hl*0.25);ctx.fillText(label,0,hl*0.25);}
  ctx.globalAlpha=1;ctx.restore();
}

// ============ MAIN DRAW ============
function draw(){
  const w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h);
  // Field image
  if(fieldImgLoaded&&fieldImg){
    const tw=(FIELD_W+2*PP_MARGIN)*camScale,th=(FIELD_H+2*PP_MARGIN)*camScale;
    ctx.globalAlpha=0.7;ctx.drawImage(fieldImg,camX,camY,tw,th);ctx.globalAlpha=1;
  }else{
    const[fx0,fy0]=fieldToCanvas(0,0),[fx1,fy1]=fieldToCanvas(FIELD_W,FIELD_H);
    ctx.fillStyle='#1a2332';ctx.fillRect(Math.min(fx0,fx1),Math.min(fy0,fy1),Math.abs(fx1-fx0),Math.abs(fy1-fy0));
  }
  // Draw active autos from station slots
  for(const slot of SLOTS){
    const sd=slotData[slot]; if(!sd.teamNum||!sd.autoName)continue;
    const team=teams[sd.teamNum]; if(!team)continue;
    const auto=team.autos[sd.autoName]; if(!auto)continue;
    const color=sd.color;
    const isRed=slot[0]==='r';
    for(const pName of auto.paths){
      const pd=team.paths[pName]; if(!pd||!pd.w||pd.w.length<2)continue;
      const wp=isRed?flipWaypoints(pd.w):pd.w;
      // Constraint zones
      for(const cz of(pd.cz||[])){
        const zc=ZONE_COLORS[cz.name]||'rgba(156,163,175,0.15)';
        drawSegRange(wp,cz.min,cz.max,zc,12*devicePixelRatio);
      }
      // Path line
      ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=3*devicePixelRatio;ctx.globalAlpha=0.85;
      const[sx,sy]=fieldToCanvas(wp[0].x,wp[0].y);ctx.moveTo(sx,sy);
      for(let s=0;s<wp.length-1;s++){const{p0,p1,p2,p3}=getSegPts(wp,s);
        const[c1x,c1y]=fieldToCanvas(p1.x,p1.y),[c2x,c2y]=fieldToCanvas(p2.x,p2.y),[ex,ey]=fieldToCanvas(p3.x,p3.y);
        ctx.bezierCurveTo(c1x,c1y,c2x,c2y,ex,ey);}
      ctx.stroke();ctx.globalAlpha=1;
      // Start/end bumpers
      const sr=isRed?flipRot(pd.start?pd.start.r:0):(pd.start?pd.start.r:0);
      const er=isRed?flipRot(pd.end?pd.end.r:0):(pd.end?pd.end.r:0);
      drawRobotBumper(wp[0].x,wp[0].y,sr,color,0.4,team.settings,sd.teamNum);
      drawRobotBumper(wp[wp.length-1].x,wp[wp.length-1].y,er,color,0.25,team.settings);
      // Event markers
      for(const em of(pd.em||[])){
        if(!em.name&&!em.cmd)continue;const pt=ptAtPos(wp,em.pos);const[mx,my]=fieldToCanvas(pt.x,pt.y);
        ctx.beginPath();ctx.arc(mx,my,9*devicePixelRatio,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fill();
        ctx.strokeStyle=color;ctx.lineWidth=2*devicePixelRatio;ctx.stroke();
        ctx.fillStyle='#fff';ctx.font=`${10*devicePixelRatio}px sans-serif`;ctx.textAlign='center';
        ctx.fillText(MARKER_ICONS[em.cmd||em.name]||'\u2b24',mx,my+3*devicePixelRatio);
        ctx.fillStyle=color;ctx.font=`bold ${8*devicePixelRatio}px sans-serif`;ctx.fillText(em.cmd||em.name,mx,my-12*devicePixelRatio);
      }
      // Rotation arrows
      for(const rt of(pd.rt||[])){
        const pt=ptAtPos(wp,rt.pos);const[rx,ry]=fieldToCanvas(pt.x,pt.y);
        const ra=(rt.rot)*Math.PI/180;const al=7*devicePixelRatio;
        ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+Math.cos(ra)*al,ry-Math.sin(ra)*al);
        ctx.strokeStyle=color;ctx.globalAlpha=0.3;ctx.lineWidth=1.5*devicePixelRatio;ctx.stroke();ctx.globalAlpha=1;
      }
      // Point-towards zones
      for(const ptz of(pd.ptz||[])){
        const mp=(ptz.min+ptz.max)/2;const pt=ptAtPos(wp,mp);const[px,py]=fieldToCanvas(pt.x,pt.y),[tx,ty]=fieldToCanvas(ptz.tx,ptz.ty);
        ctx.beginPath();ctx.setLineDash([4,4]);ctx.moveTo(px,py);ctx.lineTo(tx,ty);
        ctx.strokeStyle=color;ctx.globalAlpha=0.3;ctx.lineWidth=1.5*devicePixelRatio;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
      }
    }
  }
  // Animated robots
  if(playing||animTime>0) drawAnimRobots();
  // Draw strokes
  for(const stroke of drawStrokes){
    ctx.beginPath();ctx.strokeStyle=stroke.color;ctx.lineWidth=3*devicePixelRatio;ctx.globalAlpha=0.8;
    const[sx,sy]=fieldToCanvas(stroke.pts[0].x,stroke.pts[0].y);ctx.moveTo(sx,sy);
    for(let i=1;i<stroke.pts.length;i++){const[px,py]=fieldToCanvas(stroke.pts[i].x,stroke.pts[i].y);ctx.lineTo(px,py);}
    ctx.stroke();ctx.globalAlpha=1;
  }
  // Active draw stroke
  if(drawActive&&drawPts.length>1){
    ctx.beginPath();ctx.strokeStyle='#f59e0b';ctx.lineWidth=3*devicePixelRatio;ctx.globalAlpha=0.8;
    const[sx,sy]=fieldToCanvas(drawPts[0].x,drawPts[0].y);ctx.moveTo(sx,sy);
    for(let i=1;i<drawPts.length;i++){const[px,py]=fieldToCanvas(drawPts[i].x,drawPts[i].y);ctx.lineTo(px,py);}
    ctx.stroke();ctx.globalAlpha=1;
  }
}

function drawSegRange(wp,min,max,color,width){
  const cm=Math.max(0,min),cx=Math.min(wp.length-1,max);if(cx<=cm)return;
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;
  for(let i=0;i<=30;i++){const pos=cm+(cx-cm)*(i/30);const pt=ptAtPos(wp,pos);const[x,y]=fieldToCanvas(pt.x,pt.y);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
}

function drawAnimRobots(){
  const robots=[];
  for(const slot of SLOTS){
    const sd=slotData[slot];if(!sd.teamNum||!sd.autoName)continue;
    const team=teams[sd.teamNum];if(!team)continue;
    const auto=team.autos[sd.autoName];if(!auto)continue;
    let elapsed=getSlotDelay(slot);
    let lastPos=null;
    const pathList=auto.paths, waitList=auto.waits||[];
    for(let pi=0;pi<pathList.length;pi++){
      const pName=pathList[pi];
      const key=sd.teamNum+'_'+pName;
      if(!pathSamples[key])pathSamples[key]=buildAnimData(pName,sd.teamNum);
      const ad=pathSamples[key];if(!ad||!ad.length)continue;
      const dur=ad[ad.length-1].time,lt=animTime-elapsed;
      const pd=team.paths[pName];
      const isRed=slot[0]==='r';
      if(lt>=0&&lt<=dur){
        const p=posAtTime(ad,lt);
        let rot=pd?getRotAtPos(pd,p.pos):0;
        let rx=p.x,ry=p.y;
        if(isRed){const fp=flipPt(p.x,p.y);rx=fp.x;ry=fp.y;rot=flipRot(rot);}
        robots.push({x:rx,y:ry,rot,color:sd.color,teamNum:sd.teamNum,bot:team.settings,pd,pos:p.pos,isRed});
        lastPos=null;
      } else if(lt>dur){
        // Path finished - use goalEndState rotation
        const p=posAtTime(ad,dur);
        let rot=pd&&pd.end?pd.end.r:(pd?getRotAtPos(pd,p.pos):0);
        let rx=p.x,ry=p.y;
        if(isRed){const fp=flipPt(p.x,p.y);rx=fp.x;ry=fp.y;rot=flipRot(rot);}
        lastPos={x:rx,y:ry,rot,color:sd.color,teamNum:sd.teamNum,bot:team.settings,isRed};
      }
      elapsed+=dur;
      // Add wait time between paths (from auto command tree)
      if(pi<waitList.length)elapsed+=waitList[pi];
    }
    if(lastPos&&animTime>0)robots.push(lastPos);
  }
  // Draw robots
  for(const r of robots){
    drawRobotBumper(r.x,r.y,r.rot,r.color,0.85,r.bot,r.teamNum);
    // Flash event markers
    if(r.pd)for(const em of(r.pd.em||[])){
      if(Math.abs(r.pos-em.pos)<0.15){let ept=ptAtPos(r.pd.w,em.pos);if(r.isRed)ept=flipPt(ept.x,ept.y);const[mx,my]=fieldToCanvas(ept.x,ept.y);
        ctx.beginPath();ctx.arc(mx,my,16*devicePixelRatio,0,Math.PI*2);ctx.fillStyle=r.color;
        ctx.globalAlpha=0.3+0.3*Math.sin(Date.now()/100);ctx.fill();ctx.globalAlpha=1;}}
  }
  // Collision detection
  const cr=Math.max(0.978,0.787)*0.6;
  for(let i=0;i<robots.length;i++)for(let j=i+1;j<robots.length;j++){
    const a=robots[i],b=robots[j];if(Math.hypot(a.x-b.x,a.y-b.y)<cr){
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const[cx,cy]=fieldToCanvas(mx,my);const wr=cr*0.5*camScale;
      ctx.globalAlpha=0.6+0.3*Math.sin(Date.now()/150);ctx.beginPath();ctx.arc(cx,cy,wr,0,Math.PI*2);
      ctx.fillStyle='rgba(255,23,68,0.25)';ctx.fill();ctx.strokeStyle='#FF1744';ctx.lineWidth=3*devicePixelRatio;ctx.stroke();
      ctx.fillStyle='#FF1744';ctx.font=`bold ${9*devicePixelRatio}px sans-serif`;ctx.textAlign='center';
      ctx.fillText('COLLISION',cx,cy+wr+12*devicePixelRatio);ctx.globalAlpha=1;}}
}

// ============ STATION SLOT WIRING ============
function updateSlot(slot){
  const teamEl=document.getElementById(slot+'t'), autoEl=document.getElementById(slot+'a'), infoEl=document.getElementById(slot+'i');
  const num=teamEl.value.trim(); slotData[slot].teamNum=num;
  // Remember current selection before rebuilding dropdown
  const prevAuto=autoEl.value||slotData[slot].autoName||'';
  // Populate auto dropdown
  autoEl.innerHTML='<option value="">—</option>';
  if(num&&teams[num]){
    const autos=Object.keys(teams[num].autos).sort();
    for(const a of autos){autoEl.innerHTML+=`<option value="${a}">${a}</option>`;}
    // Restore previous selection if it still exists in the new list
    if(prevAuto&&autos.includes(prevAuto)){autoEl.value=prevAuto;slotData[slot].autoName=prevAuto;}
    else{slotData[slot].autoName='';}
    const t=teams[num];
    infoEl.textContent=t.name+(t.epa?` | EPA: ${t.epa}`:'')+(t.autoEpa!=null?` | Auto: ${t.autoEpa.toFixed(1)}`:'')+(t.record?` | ${t.record}`:'');
  }else if(num){
    slotData[slot].autoName='';
    infoEl.textContent='Team not loaded';
  }else{slotData[slot].autoName='';infoEl.textContent='';}
  updateLegend();draw();
}
function onAutoSelect(slot){
  slotData[slot].autoName=document.getElementById(slot+'a').value;
  pathSamples={};updateTotalTime();updateLegend();draw();
  autoSaveMatchState();
}
// Wire all slots
SLOTS.forEach(s=>{
  document.getElementById(s+'t').onchange=()=>{updateSlot(s);lookupEpa(s);autoSaveMatchState();};
  document.getElementById(s+'a').onchange=()=>onAutoSelect(s);
  document.getElementById(s+'d').onchange=()=>{updateTotalTime();draw();autoSaveMatchState();};
});

// ============ AUTO-SAVE/RESTORE PER MATCH ============
function getMatchStateKey(){return selectedMatchKey?'bb_match_'+selectedMatchKey:'bb_match_last';}

function autoSaveMatchState(){
  const state={};
  SLOTS.forEach(s=>{state[s]={auto:document.getElementById(s+'a').value,delay:parseFloat(document.getElementById(s+'d').value)||0};});
  state.strokes=drawStrokes;
  try{localStorage.setItem(getMatchStateKey(),JSON.stringify(state));}catch(e){}
  // Also save which match is selected
  try{localStorage.setItem('bb_selectedMatch',selectedMatchKey);localStorage.setItem('bb_currentEvent',currentEvent);}catch(e){}
}

function autoRestoreMatchState(){
  try{
    const saved=localStorage.getItem(getMatchStateKey());
    if(!saved)return;
    const state=JSON.parse(saved);
    SLOTS.forEach(s=>{
      if(state[s]){
        if(state[s].auto){document.getElementById(s+'a').value=state[s].auto;onAutoSelect(s);}
        if(state[s].delay!=null)document.getElementById(s+'d').value=state[s].delay;
      }
    });
    if(state.strokes)drawStrokes=state.strokes;
    pathSamples={};updateTotalTime();updateLegend();draw();
  }catch(e){}
}

function updateLegend(){
  const leg=document.getElementById('legend');leg.innerHTML='';
  for(const s of SLOTS){const sd=slotData[s];if(!sd.teamNum||!sd.autoName)continue;
    leg.innerHTML+=`<div class="li"><div class="ld" style="background:${sd.color}"></div>${sd.teamNum}: ${sd.autoName}</div>`;}
}
// Per-station delay from the delay input
function getSlotDelay(slot){return parseFloat(document.getElementById(slot+'d')?.value||0)||0;}

function updateTotalTime(){
  totalTime=0;
  for(const s of SLOTS){const sd=slotData[s];if(!sd.teamNum||!sd.autoName)continue;
    const team=teams[sd.teamNum];if(!team)continue;const auto=team.autos[sd.autoName];if(!auto)continue;
    let t=getSlotDelay(s);
    for(const pn of auto.paths){const k=sd.teamNum+'_'+pn;if(!pathSamples[k])pathSamples[k]=buildAnimData(pn);
      const ad=pathSamples[k];if(ad&&ad.length)t+=ad[ad.length-1].time;}
    for(const w of(auto.waits||[]))t+=w; totalTime=Math.max(totalTime,t);}
  totalTime=Math.max(totalTime,20); // 2026 auto period is 20s
  document.getElementById('timeDisp').textContent=`0.00s / ${totalTime.toFixed(2)}s`;
}

document.getElementById('eventPicker').onchange=async()=>{

    if(!r.ok)throw new Error('TBA: '+r.status);
    allMatches=await r.json();
    allMatches.sort((a,b)=>{
      const ord={qm:0,sf:1,f:2};
      const at=a.comp_level||'qm',bt=b.comp_level||'qm';
      if(at!==bt)return(ord[at]||0)-(ord[bt]||0);
      if(a.set_number!==b.set_number)return a.set_number-b.set_number;
      return a.match_number-b.match_number;
    });
    renderMatchList(teamNum);
  }catch(e){list.innerHTML='<div style="padding:8px;color:#fca5a5;text-align:center">Failed to load matches</div>';}
};

function matchLabel(m){
  const lvl=m.comp_level||'qm';
  if(lvl==='qm')return`Qual ${m.match_number}`;
  if(lvl==='sf')return`SF${m.set_number}-${m.match_number}`;
  if(lvl==='f')return`Final ${m.match_number}`;
  return m.key;
}

let selectedMatchKey='';

function renderMatchList(teamNum){
  const list=document.getElementById('matchList');
  list.innerHTML='';
  if(!allMatches.length){list.innerHTML='<div style="padding:8px;color:#6b7280;text-align:center">No matches found</div>';return;}
  for(const m of allMatches){
    const red=(m.alliances?.red?.team_keys||[]).map(k=>k.replace('frc',''));
    const blue=(m.alliances?.blue?.team_keys||[]).map(k=>k.replace('frc',''));
    const isRed=red.includes(teamNum);
    const played=m.alliances?.red?.score>=0&&m.alliances?.blue?.score>=0;
    const score=played?`${m.alliances.red.score}-${m.alliances.blue.score}`:'';
    const el=document.createElement('div');
    el.className='ml-item'+(m.key===selectedMatchKey?' sel':'')+(played?' done':'');
    el.dataset.key=m.key;
    el.innerHTML=`<div>
      <div class="ml-label">${matchLabel(m)}${score?' <span style="color:#6b7280">('+score+')</span>':' <span style="color:#22c55e">Upcoming</span>'}</div>
      <div class="ml-teams"><span style="color:${isRed?'#fca5a5':'#93c5fd'};font-weight:600">${isRed?'Red':'Blue'}</span>: ${isRed?red.join(', '):blue.join(', ')} vs ${isRed?blue.join(', '):red.join(', ')}</div>
    </div>`;
    el.onclick=()=>selectMatch(m.key,teamNum);
    list.appendChild(el);
  }
  // Scroll to first upcoming match
  const upcoming=list.querySelector('.ml-item:not(.done)');
  if(upcoming)upcoming.scrollIntoView({block:'nearest'});
}

function selectMatch(key,teamNum){
  // Save current match state before switching
  autoSaveMatchState();
  selectedMatchKey=key;
  const m=allMatches.find(x=>x.key===key);
  if(!m)return;
  // Highlight selected
  document.querySelectorAll('.ml-item').forEach(el=>el.classList.toggle('sel',el.dataset.key===key));
  // Fill teams from TBA
  const red=(m.alliances?.red?.team_keys||[]).map(k=>k.replace('frc',''));
  const blue=(m.alliances?.blue?.team_keys||[]).map(k=>k.replace('frc',''));
  ['r1','r2','r3'].forEach((s,i)=>{document.getElementById(s+'t').value=red[i]||'';updateSlot(s);});
  ['b1','b2','b3'].forEach((s,i)=>{document.getElementById(s+'t').value=blue[i]||'';updateSlot(s);});
  // Restore saved state first, THEN lookup EPAs (which won't clobber dropdowns)
  autoRestoreMatchState();
  // EPA lookups are async - they update info text but won't rebuild dropdowns now
  Promise.all(SLOTS.map(s=>lookupEpa(s))).then(()=>autoRestoreMatchState());
}

// ============ STATBOTICS EPA ============
async function lookupEpa(slot){
  const num=slotData[slot].teamNum;if(!num)return;
  try{
    const r=await fetch(`https://api.statbotics.io/v3/team/${num}`);if(!r.ok)return;
    const d=await r.json();
    if(!teams[num]){teams[num]={name:d.name||'',settings:DEFAULT_ROBOT,autos:{},paths:{},epa:null,record:'',autoEpa:null};addDefaultsToTeam(teams[num]);}
    teams[num].name=d.name||teams[num].name; teams[num].epa=d.norm_epa?.current||0;
    teams[num].record=`${d.wins||0}-${d.losses||0}`;
    // Try event-specific stats for auto EPA breakdown
    const ev=currentEvent;
    if(ev){
      try{
        const r2=await fetch(`https://api.statbotics.io/v3/team_event/${num}/${ev}`);
        if(r2.ok){
          const d2=await r2.json();
          teams[num].autoEpa=d2.epa?.auto_points||d2.epa?.breakdown?.auto_points||null;
          if(d2.record)teams[num].record=`${d2.record.wins||0}-${d2.record.losses||0}-${d2.record.ties||0}`;
        }
      }catch(e2){}
    }
    updateSlot(slot);updateRoster();computeWinProb();
  }catch(e){}
}
function computeWinProb(){
  let re=0,rc=0,be=0,bc=0;
  ['r1','r2','r3'].forEach(s=>{const n=slotData[s].teamNum;if(n&&teams[n]&&teams[n].epa){re+=teams[n].epa;rc++;}});
  ['b1','b2','b3'].forEach(s=>{const n=slotData[s].teamNum;if(n&&teams[n]&&teams[n].epa){be+=teams[n].epa;bc++;}});
  const wp=document.getElementById('wpArea');
  if(rc>0&&bc>0){
    const ra=re/rc,ba=be/bc,rp=1/(1+Math.exp(-(ra-ba)/50));
    wp.style.display='block';
    wp.innerHTML=`<div class="wp-labels"><span style="color:#dc2626;font-weight:700">RED ${(rp*100).toFixed(0)}%</span><span style="color:#2563eb;font-weight:700">${((1-rp)*100).toFixed(0)}% BLUE</span></div>
      <div class="wp-bar"><div class="wp-r" style="width:${rp*100}%"></div><div class="wp-b" style="width:${(1-rp)*100}%"></div></div>
      <div class="wp-labels"><span style="color:#6b7280">Avg EPA: ${ra.toFixed(0)}</span><span style="color:#6b7280">Avg EPA: ${ba.toFixed(0)}</span></div>`;
  }else{wp.style.display='none';}
}

  const el=document.getElementById('teamRoster');el.innerHTML='';

// ============ FOLDER IMPORT ============
function parseSettingsJson(data){
  return{
    w:data.robotWidth||0.9, h:data.robotLength||0.8,
    modules:[{x:data.flModuleX||0,y:data.flModuleY||0},{x:data.frModuleX||0,y:data.frModuleY||0},{x:data.blModuleX||0,y:data.blModuleY||0},{x:data.brModuleX||0,y:data.brModuleY||0}],
    features:(data.robotFeatures||[]).map(raw=>{
      const f=typeof raw==='string'?JSON.parse(raw):raw;const d=f.data||{};
      if(f.type==='circle')return{name:f.name||'',type:'circle',cx:d.center?.x||0,cy:d.center?.y||0,radius:d.radius||0,strokeWidth:d.strokeWidth||0.01,filled:!!d.filled};
      return{name:f.name||'',type:'rounded_rect',cx:d.center?.x||0,cy:d.center?.y||0,width:d.size?.width||0,length:d.size?.length||0,borderRadius:d.borderRadius||0,strokeWidth:d.strokeWidth||0.02,filled:!!d.filled};
    })
  };
}
function parsePath(data){
  const wp=(data.waypoints||[]).map(w=>{const e={x:w.anchor.x,y:w.anchor.y};if(w.nextControl)e.nc={x:w.nextControl.x,y:w.nextControl.y};if(w.prevControl)e.pc={x:w.prevControl.x,y:w.prevControl.y};return e;});
  const gc=data.globalConstraints||{};
  const em=(data.eventMarkers||[]).map(m=>({name:m.name||'',pos:m.waypointRelativePos||0,cmd:m.command?.data?.name||''}));
  const cz=(data.constraintZones||[]).map(z=>({name:z.name||'',min:z.minWaypointRelativePos||0,max:z.maxWaypointRelativePos||0,maxVel:z.constraints?.maxVelocity||2}));
  const ptz=(data.pointTowardsZones||[]).map(p=>({name:p.name||'',tx:p.fieldPosition?.x||0,ty:p.fieldPosition?.y||0,min:p.minWaypointRelativePos||0,max:p.maxWaypointRelativePos||0}));
  const rt=(data.rotationTargets||[]).map(r=>({pos:r.waypointRelativePos||0,rot:r.rotationDegrees||0}));
  const gs=data.goalEndState||{},is=data.idealStartingState||{};
  return{w:wp,mv:gc.maxVelocity||2,ma:gc.maxAcceleration||3,em,cz,ptz,rt,end:{v:gs.velocity||0,r:gs.rotation||0},start:{v:is.velocity||0,r:is.rotation||0}};
}
function parseAuto(data){
  const paths=[],cmds=[],waits=[];
  const walk=cmd=>{const t=cmd.type||'',d=cmd.data||{};
    if(t==='path')paths.push(d.pathName||'');else if(t==='named')cmds.push(d.name||'');else if(t==='wait')waits.push(d.waitTime||0);
    for(const s of(d.commands||[]))walk(s);};
  walk(data.command||{});
  return{folder:data.folder||'',paths,cmds,waits};
}

// Handle folder upload via webkitdirectory
document.getElementById('fileIn').onchange=e=>handleFolderFiles(e.target.files);
// Handle flat file upload
document.getElementById('fileInFlat').onchange=e=>{
  const num=prompt('Team number for these files:');if(!num)return;

function handleFolderFiles(fileList){
  // Group by top-level folder (team number)
  const byTeam={};
  for(const f of fileList){
    const parts=f.webkitRelativePath.split('/');
    const teamNum=parts[0]||'unknown';
    if(!byTeam[teamNum])byTeam[teamNum]=[];
    byTeam[teamNum].push(f);
  }
  for(const[num,files]of Object.entries(byTeam))importFilesForTeam(num,files);
}

async function importFilesForTeam(teamNum,files){
  if(!teams[teamNum]){teams[teamNum]={name:'',settings:{...DEFAULT_ROBOT},autos:{},paths:{},epa:null,record:''};addDefaultsToTeam(teams[teamNum]);}
  const t=teams[teamNum];
  for(const f of files){
    try{
      const text=await f.text();const data=JSON.parse(text);const name=f.name.replace(/\.(auto|path|json)$/,'');
      if(f.name==='settings.json'||f.name.endsWith('settings.json')){t.settings=parseSettingsJson(data);}
      else if(f.name.endsWith('.path')){t.paths[name]=parsePath(data);}
      else if(f.name.endsWith('.auto')){t.autos[name]=parseAuto(data);}
    }catch(e){console.warn('Skip',f.name,e);}
  }
  pathSamples={};updateRoster();
  // Refresh any slot that has this team
  SLOTS.forEach(s=>{if(slotData[s].teamNum===teamNum)updateSlot(s);});
  draw();
}

// Drag and drop
let dragCt=0;const dropOv=document.getElementById('dropOv');
document.addEventListener('dragenter',e=>{e.preventDefault();dragCt++;dropOv.classList.add('vis');});
document.addEventListener('dragleave',e=>{e.preventDefault();dragCt--;if(dragCt<=0){dropOv.classList.remove('vis');dragCt=0;}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',async e=>{
  e.preventDefault();dropOv.classList.remove('vis');dragCt=0;
  // Try to read as folder entries
  const items=[...e.dataTransfer.items];
  const folderEntries=[];
  for(const item of items){
    const entry=item.webkitGetAsEntry&&item.webkitGetAsEntry();
    if(entry&&entry.isDirectory)folderEntries.push(entry);
  }
  if(folderEntries.length>0){
    for(const dir of folderEntries){
      const files=await readDirRecursive(dir);
      importFilesForTeam(dir.name,files);
    }
  }else{
    // Flat files - ask for team number
    const files=[...e.dataTransfer.files];
    if(files.length>0){const num=prompt('Team number for these files:');if(num)importFilesForTeam(num,files);}
  }
});

function readDirRecursive(dirEntry){
  return new Promise(resolve=>{
    const files=[];
    const reader=dirEntry.createReader();
    const readBatch=()=>{
      reader.readEntries(async entries=>{
        if(entries.length===0){resolve(files);return;}
        for(const entry of entries){
          if(entry.isFile){const f=await new Promise(r=>entry.file(r));files.push(f);}
          else if(entry.isDirectory){const sub=await readDirRecursive(entry);files.push(...sub);}
        }
        readBatch();
      });
    };
    readBatch();
  });
}

// ============ PENCIL DRAWING ============
let drawPts=[];
document.getElementById('drawBtn').onclick=()=>{drawMode=!drawMode;document.getElementById('drawBtn').classList.toggle('act',drawMode);canvas.style.cursor=drawMode?'crosshair':'default';};
canvas.addEventListener('mousedown',e=>{if(!drawMode||e.button!==0)return;e.preventDefault();drawActive=true;
  const[fx,fy]=canvasToField(e.offsetX*devicePixelRatio,e.offsetY*devicePixelRatio);drawPts=[{x:fx,y:fy}];});
canvas.addEventListener('mousemove',e=>{if(!drawActive)return;
  const[fx,fy]=canvasToField(e.offsetX*devicePixelRatio,e.offsetY*devicePixelRatio);
  const last=drawPts[drawPts.length-1];if(Math.hypot(fx-last.x,fy-last.y)>0.05){drawPts.push({x:fx,y:fy});draw();}});
canvas.addEventListener('mouseup',()=>{if(!drawActive)return;drawActive=false;
  if(drawPts.length>2){drawStrokes.push({pts:[...drawPts],color:'#f59e0b'});autoSaveMatchState();}drawPts=[];draw();});

document.getElementById('clrBtn').onclick=()=>{
  drawStrokes=[];SLOTS.forEach(s=>{slotData[s].autoName='';document.getElementById(s+'a').value='';});
  animTime=0;playing=false;document.getElementById('playBtn').innerHTML='&#9654;';
  pathSamples={};updateLegend();draw();
};

// ============ HOVER TOOLTIPS ============
canvas.addEventListener('mousemove',e=>{
  if(drawActive)return;
  const mx=e.offsetX*devicePixelRatio,my=e.offsetY*devicePixelRatio;const tt=document.getElementById('mtt');let found=false;
  for(const slot of SLOTS){const sd=slotData[slot];if(!sd.teamNum||!sd.autoName)continue;
    const team=teams[sd.teamNum];if(!team)continue;const auto=team.autos[sd.autoName];if(!auto)continue;
    for(const pn of auto.paths){const pd=team.paths[pn];if(!pd)continue;
      for(const em of(pd.em||[])){if(!em.name&&!em.cmd)continue;const pt=ptAtPos(pd.w,em.pos);const[cx,cy]=fieldToCanvas(pt.x,pt.y);
        if(Math.hypot(mx-cx,my-cy)<14*devicePixelRatio){tt.style.display='block';tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY-10)+'px';
          tt.textContent=`${em.cmd||em.name} (${pn} @ ${em.pos.toFixed(2)})`;found=true;break;}}
      if(found)break;}if(found)break;}
  if(!found)tt.style.display='none';
});

// ============ ANIMATION ============
function animate(ts){
  if(playing){if(lastFrame===0)lastFrame=ts;const dt=(ts-lastFrame)/1000*animSpeed;animTime+=dt;
    if(animTime>totalTime)animTime=0;lastFrame=ts;
    document.getElementById('scrubber').value=(animTime/totalTime)*1000;
    document.getElementById('timeDisp').textContent=`${animTime.toFixed(2)}s / ${totalTime.toFixed(2)}s`;draw();}
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('restartBtn').onclick=()=>{animTime=0;lastFrame=0;
  document.getElementById('scrubber').value=0;
  document.getElementById('timeDisp').textContent=`0.00s / ${totalTime.toFixed(2)}s`;draw();};
document.getElementById('playBtn').onclick=()=>{playing=!playing;lastFrame=0;
  document.getElementById('playBtn').innerHTML=playing?'&#9646;&#9646;':'&#9654;';};
document.getElementById('scrubber').oninput=e=>{animTime=(e.target.value/1000)*totalTime;
  document.getElementById('timeDisp').textContent=`${animTime.toFixed(2)}s / ${totalTime.toFixed(2)}s`;draw();};
document.querySelectorAll('.spb').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.spb').forEach(x=>x.classList.remove('act'));b.classList.add('act');animSpeed=parseFloat(b.dataset.speed);};});

// ============ SCREENSHOT ============
document.getElementById('screenshotBtn').onclick=()=>{
  draw(); // ensure canvas is current
  const link=document.createElement('a');
  const ev=currentEvent;
  const mk=selectedMatchKey;
  const name=mk?`breadboard-${mk}.png`:(ev?`breadboard-${ev}.png`:'breadboard.png');

};

// ============ SAVE/LOAD CONFIG ============
document.getElementById('saveBtn').onclick=()=>{
  const config={
    event:currentEvent,
    matchKey:selectedMatchKey,
    slots:{},
    strokes:drawStrokes
  };
  SLOTS.forEach(s=>{config.slots[s]={team:slotData[s].teamNum,auto:slotData[s].autoName,delay:getSlotDelay(s)};});
  const blob=new Blob([JSON.stringify(config,null,2)],{type:'application/json'});
  const link=document.createElement('a');
  const ev=config.event||'match';
  link.download=`breadboard-${ev}-config.json`;link.href=URL.createObjectURL(blob);link.click();
  URL.revokeObjectURL(link.href);
};
document.querySelector('#loadIn').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const config=JSON.parse(await f.text());
    if(config.event)currentEvent=config.event;
    if(config.strokes)drawStrokes=config.strokes;
    if(config.slots){
      SLOTS.forEach(s=>{
        if(config.slots[s]){
          document.getElementById(s+'t').value=config.slots[s].team||'';
          if(config.slots[s].delay!=null)document.getElementById(s+'d').value=config.slots[s].delay;
          updateSlot(s);
          if(config.slots[s].auto){
            document.getElementById(s+'a').value=config.slots[s].auto;
            onAutoSelect(s);
          }
        }
      });
    }
    pathSamples={};updateTotalTime();updateLegend();draw();
  }catch(err){alert('Failed to load config: '+err.message);}
  e.target.value='';
};

// ============ TOUCH SUPPORT ============
function touchToField(touch){
  const rect=canvas.getBoundingClientRect();
  const cx=(touch.clientX-rect.left)*devicePixelRatio;
  const cy=(touch.clientY-rect.top)*devicePixelRatio;
  return canvasToField(cx,cy);
}
canvas.addEventListener('touchstart',e=>{
  if(!drawMode)return;e.preventDefault();
  drawActive=true;const[fx,fy]=touchToField(e.touches[0]);drawPts=[{x:fx,y:fy}];
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(!drawActive)return;e.preventDefault();
  const[fx,fy]=touchToField(e.touches[0]);
  const last=drawPts[drawPts.length-1];
  if(Math.hypot(fx-last.x,fy-last.y)>0.05){drawPts.push({x:fx,y:fy});draw();}
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(!drawActive)return;e.preventDefault();drawActive=false;
  if(drawPts.length>2){drawStrokes.push({pts:[...drawPts],color:'#f59e0b'});autoSaveMatchState();}drawPts=[];draw();
},{passive:false});

// ============ DEFAULT STARTING POSITIONS ============

// These are available for any team that doesn't have PathPlanner files

  'Start: Left Trench':    {folder:'Presets', paths:['_start_lt'],  cmds:[], waits:[]},
  'Start: Right Trench':   {folder:'Presets', paths:['_start_rt'],  cmds:[], waits:[]},
  'Start: Left Bump':      {folder:'Presets', paths:['_start_lb'],  cmds:[], waits:[]},
  'Start: Right Bump':     {folder:'Presets', paths:['_start_rb'],  cmds:[], waits:[]},
  'Start: Alliance Zone':  {folder:'Presets', paths:['_start_az'],  cmds:[], waits:[]},
};
// Minimal path data - just a start point so the robot appears on field
const DEFAULT_PATHS = {
  '_start_lt': {w:[{x:4.5,y:7.66},{x:4.5,y:7.56}], mv:0.5, ma:1, em:[], cz:[], ptz:[], rt:[], start:{v:0,r:-90}, end:{v:0,r:-90}},

  '_start_lb': {w:[{x:3.5,y:7.20},{x:3.5,y:7.10}], mv:0.5, ma:1, em:[], cz:[], ptz:[], rt:[], start:{v:0,r:90},  end:{v:0,r:90}},
  '_start_rb': {w:[{x:3.5,y:0.87},{x:3.5,y:0.97}], mv:0.5, ma:1, em:[], cz:[], ptz:[], rt:[], start:{v:0,r:-90}, end:{v:0,r:-90}},
  '_start_az': {w:[{x:3.6,y:6.29},{x:3.5,y:6.29}], mv:0.5, ma:1, em:[], cz:[], ptz:[], rt:[], start:{v:0,r:180}, end:{v:0,r:180}},
};

// Inject defaults into every team (including ones loaded later)
function addDefaultsToTeam(team){
  for(const[name,auto] of Object.entries(DEFAULT_STARTS)){
    if(!team.autos[name])team.autos[name]=auto;
  }
  for(const[name,path] of Object.entries(DEFAULT_PATHS)){
    if(!team.paths[name])team.paths[name]=path;
  }
}
// Add to existing teams
for(const t of Object.values(teams))addDefaultsToTeam(t);

// Restore last session state
try{

  const lastEvent=localStorage.getItem('bb_currentEvent');
  if(lastEvent)currentEvent=lastEvent;
  if(lastMatch)selectedMatchKey=lastMatch;
  autoRestoreMatchState();
}catch(e){}
